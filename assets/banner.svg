<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">The PIR® Gallery</title>
  <desc id="d">Every gathering's albums, in a home the fellowship owns. The picture: 9 stars arrive and join into one constellation. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d153a"/><stop offset="1" stop-color="#111126"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#7c3aed"/><stop offset="0.50" stop-color="#7c55c4"/><stop offset="1.00" stop-color="#baa6e4"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#7c55c4" stop-opacity="0"/><stop offset=".35" stop-color="#7c55c4"/><stop offset="1" stop-color="#baa6e4"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <circle class="halo" cx="701.9" cy="64.9" r="13" fill="none" stroke="#baa6e4" stroke-width="2"/>
    <path class="draw" pathLength="100" d="M701.9 64.9L761.3 84.4" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <path class="draw" pathLength="100" d="M761.3 84.4L825.7 73.8" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.52s"/>
    <path class="draw" pathLength="100" d="M825.7 73.8L907.8 74.8" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.74s"/>
    <path class="draw" pathLength="100" d="M825.7 73.8L817.3 158.5" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.96s"/>
    <path class="draw" pathLength="100" d="M907.8 74.8L1005.2 99.7" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.18s"/>
    <path class="draw" pathLength="100" d="M1005.2 99.7L1060.5 48.7" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M1005.2 99.7L971.3 200.5" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.62s"/>
    <path class="draw" pathLength="100" d="M971.3 200.5L1052.8 197.2" fill="none" stroke="#483278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.84s"/>
    <circle class="arrive" style="animation-delay:0.15s" cx="701.9" cy="64.9" r="8.0" fill="#7c55c4"/>
    <circle class="arrive" style="animation-delay:0.39s" cx="907.8" cy="74.8" r="5.9" fill="#baa6e4"/>
    <circle class="arrive" style="animation-delay:0.63s" cx="1005.2" cy="99.7" r="5.3" fill="#baa6e4"/>
    <circle class="arrive" style="animation-delay:0.87s" cx="817.3" cy="158.5" r="5.5" fill="#baa6e4"/>
    <circle class="arrive" style="animation-delay:1.11s" cx="971.3" cy="200.5" r="3.1" fill="#baa6e4"/>
    <circle class="arrive" style="animation-delay:1.35s" cx="761.3" cy="84.4" r="4.5" fill="#baa6e4"/>
    <circle class="arrive" style="animation-delay:1.59s" cx="825.7" cy="73.8" r="6.1" fill="#baa6e4"/>
    <circle class="arrive" style="animation-delay:1.83s" cx="1052.8" cy="197.2" r="4.1" fill="#baa6e4"/>
    <circle class="arrive" style="animation-delay:2.07s" cx="1060.5" cy="48.7" r="6.4" fill="#baa6e4"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#3b1f6e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#7c3aed"/><rect x="600.0" y="248" width="300.5" height="12" fill="#5b2bb5"/><rect x="900.0" y="248" width="300.5" height="12" fill="#ede9fe"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#9373ce" font-size="15" font-weight="700" letter-spacing=".6">PIR® · Psychedelics In Recovery™</text><text x="56" y="122.2" fill="#ede9fe" font-size="60" font-weight="700" letter-spacing="-.5">The PIR® Gallery</text><text x="56" y="166.0" fill="#d0cbe3" font-size="23">Every gathering's albums, in a home the fellowship</text><text x="56" y="196.8" fill="#d0cbe3" font-size="23">owns.</text></g>
  </g>
</svg>
