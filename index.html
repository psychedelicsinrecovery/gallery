<!doctype html>
<html lang="en" data-arrival-site="gallery" data-arrival-splash="off">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The PIR® Gallery · Psychedelics In Recovery™ – PIR®</title>
  <meta name="description" content="The fellowship's own gallery — photo albums of Psychedelics In Recovery™ – PIR®, kept on the fellowship's own ground. Browse, remember, and add your own photos." />
  <meta name="theme-color" content="#06050e" />
  <meta property="og:site_name" content="PIR® Gallery" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The PIR® Gallery" />
  <meta property="og:description" content="The fellowship's photo albums — browsable, downloadable, kept on GitHub. Born from a WhatsApp request that went wonderfully rogue." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />
  <link rel="stylesheet" href="https://psychedelicsinrecovery.github.io/arrival/arrival.css" />
  <link rel="stylesheet" href="https://psychedelicsinrecovery.github.io/arrival/org.css" />
  <link rel="stylesheet" href="https://psychedelicsinrecovery.github.io/alex-desk-public/assets/alex.css" />
  <style>
    /* Site-prefixed tokens on purpose: the kit owns --ink, --muted and friends. */
    :root {
      --gal-ink: #f3eee4;
      --gal-muted: rgba(243, 238, 228, 0.66);
      --gal-gold: #e8b45a;
      --gal-violet: #a78bfa;
      --gal-panel: rgba(255, 255, 255, 0.05);
      --gal-line: rgba(255, 255, 255, 0.12);
      --gal-serif: "Fraunces", Georgia, serif;
      --gal-sans: "Manrope", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--gal-ink); background: #06050e; font-family: var(--gal-sans); -webkit-font-smoothing: antialiased; }
    #starfield-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .gal-wrap { max-width: 1180px; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2.5rem); position: relative; z-index: 5; }

    header.top { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); background: rgba(6, 5, 14, 0.55); border-bottom: 1px solid var(--gal-line); }
    header.top .wrap { display: flex; align-items: center; gap: 1rem; min-height: 64px; max-width: 1180px; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2.5rem); }
    main { position: relative; z-index: 10; }
    .gal-hero { padding: clamp(2.4rem, 6vw, 4rem) 0 1.2rem; text-align: center; }
    .gal-hero .gal-kicker { margin-inline: auto; }
    .gal-hero .gal-lede { margin-inline: auto; }
    .gal-kicker { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gal-gold); border: 1px solid rgba(232, 180, 90, 0.35); border-radius: 999px; padding: 0.35rem 0.9rem; background: rgba(232, 180, 90, 0.08); }
    h1 { font-family: var(--gal-serif); font-size: clamp(2.2rem, 5.5vw, 3.8rem); line-height: 1.05; letter-spacing: -0.02em; margin: 1rem 0 0.7rem; color: var(--gal-ink); }
    .gal-lede { font-size: clamp(1rem, 1.5vw, 1.18rem); color: var(--gal-muted); max-width: 62ch; line-height: 1.6; }
    .gal-lede a, .gal-band a.inline { color: var(--gal-gold); text-decoration: none; }
    .gal-lede a:hover, .gal-band a.inline:hover { text-decoration: underline; }
    .gal-cta { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.6rem; justify-content: center; }
    .gal-btn { display: inline-flex; align-items: center; gap: 0.55rem; font-weight: 700; font-size: 0.95rem; padding: 0.72rem 1.35rem; border-radius: 999px; text-decoration: none; border: 1px solid var(--gal-line); color: var(--gal-ink); background: var(--gal-panel); transition: transform 0.15s, border-color 0.15s; cursor: pointer; }
    .gal-btn:hover { transform: translateY(-2px); border-color: rgba(232, 180, 90, 0.55); }
    .gal-btn.primary { background: linear-gradient(120deg, var(--gal-violet), var(--gal-gold)); color: #17120a; border-color: transparent; }

    /* The marquee — what the albums will hold, looping gently. Pure CSS, pauses on hover. */
    .gal-marquee { overflow: hidden; border-block: 1px solid var(--gal-line); background: rgba(255, 255, 255, 0.03); margin: 1.8rem 0 0.4rem; }
    .gal-marquee-label { max-width: 1180px; margin: 0 auto; padding: 0.8rem clamp(1rem, 4vw, 2.5rem) 0; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gal-gold); }
    .gal-track { display: flex; gap: 2.75rem; width: max-content; padding: 0.9rem 0; animation: gal-scroll 42s linear infinite; }
    .gal-marquee:hover .gal-track { animation-play-state: paused; }
    .gal-track span { display: inline-flex; align-items: center; gap: 0.55rem; font-family: var(--gal-serif); font-size: 1rem; color: var(--gal-muted); white-space: nowrap; }
    .gal-track i { color: var(--gal-gold); }
    .gal-track em { font-style: normal; color: var(--gal-violet); }
    @keyframes gal-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .gal-track { animation: none; flex-wrap: wrap; width: auto; justify-content: center; } }

    /* Image-tile marquee + centered hero */
    .gal-tile { position: relative; flex: 0 0 auto; width: 212px; aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; border: 1px solid var(--gal-line, rgba(255, 255, 255, 0.12)); background: var(--gal-panel, #141126); }
    .gal-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gal-tile figcaption { position: absolute; inset: auto 0 0 0; padding: 0.55rem 0.7rem; font-size: 0.78rem; font-weight: 600; color: #f3eee4; background: linear-gradient(transparent, rgba(6, 5, 14, 0.92)); opacity: 0; transition: opacity 0.18s ease; }
    .gal-tile:hover figcaption { opacity: 1; }
    .gal-marquee-note { margin: 0.2rem 0 0.5rem; font-size: 0.82rem; font-style: italic; color: rgba(243, 238, 228, 0.55); }

    /* Album spot cards — the entry-portal card language */
    .gal-band { padding: clamp(1.6rem, 4vw, 2.6rem) 0; }
    .gal-band-head { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.2rem; }
    .gal-band-head h2 { font-family: var(--gal-serif); font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: -0.01em; margin: 0; color: var(--gal-ink); }
    .gal-band-head .rule { flex: 1; height: 1px; background: var(--gal-line); }
    .gal-band-head a { font-family: var(--gal-sans); font-size: 0.88rem; font-weight: 600; color: var(--gal-gold); text-decoration: none; }
    .gal-band-head a:hover { text-decoration: underline; }

    .gal-story { margin: 1.4rem 0; border: 1px solid var(--gal-line); border-radius: 22px; background: linear-gradient(120deg, rgba(167, 139, 250, 0.1), rgba(232, 180, 90, 0.07)); padding: 1.7rem; }
    .gal-story h2 { font-family: var(--gal-serif); margin: 0 0 0.5rem; font-size: 1.5rem; color: var(--gal-ink); }
    .gal-story p { margin: 0.5rem 0; color: var(--gal-muted); font-size: 0.95rem; line-height: 1.65; max-width: 75ch; }
    .gal-story strong { color: var(--gal-ink); }
    .gal-story .row { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-top: 0.8rem; }

    .gal-spots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1rem; margin: 0.4rem 0 1rem; }
    .gal-spot { position: relative; display: flex; flex-direction: column; gap: 0.35rem; border: 1px solid var(--gal-line); border-radius: 18px; background: var(--gal-panel); padding: 1.4rem; text-decoration: none; color: var(--gal-ink); transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; }
    .gal-spot:hover { transform: translateY(-3px); border-color: rgba(232, 180, 90, 0.55); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
    .gal-spot .s-icon { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border-radius: 12px; background: rgba(232, 180, 90, 0.12); border: 1px solid rgba(232, 180, 90, 0.25); color: var(--gal-gold); font-size: 1.25rem; margin-bottom: 0.4rem; }
    .gal-spot.featured .s-icon { background: rgba(167, 139, 250, 0.14); border-color: rgba(167, 139, 250, 0.35); color: var(--gal-violet); }
    .gal-spot h3 { font-family: var(--gal-serif); font-size: 1.15rem; margin: 0; color: var(--gal-ink); }
    .gal-spot .s-meta { font-size: 0.83rem; color: var(--gal-muted); display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .gal-spot .s-count { display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 700; color: var(--gal-gold); background: rgba(232, 180, 90, 0.1); border: 1px solid rgba(232, 180, 90, 0.3); border-radius: 999px; padding: 0.14rem 0.55rem; }
    .gal-spot .s-links { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.5rem; }
    .gal-spot .s-links a { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 600; color: var(--gal-ink); text-decoration: none; border: 1px solid var(--gal-line); border-radius: 999px; padding: 0.32rem 0.75rem; }
    .gal-spot .s-links a:hover { border-color: rgba(232, 180, 90, 0.55); }
    .gal-spot.featured { border-color: rgba(167, 139, 250, 0.55); background: linear-gradient(140deg, rgba(167, 139, 250, 0.1), rgba(232, 180, 90, 0.06)); }
    .gal-spot.featured::after { content: "The one that started it all"; position: absolute; top: -0.85rem; left: 1.1rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #17120a; background: linear-gradient(120deg, var(--gal-violet), var(--gal-gold)); border-radius: 999px; padding: 0.22rem 0.7rem; }

    .gal-album-head { margin: 2.6rem 0 1rem; scroll-margin-top: 90px; }
    .gal-album-head h2 { font-family: var(--gal-serif); font-size: 1.6rem; margin: 0 0 0.2rem; color: var(--gal-ink); }
    .gal-album-head .meta { font-size: 0.85rem; color: var(--gal-muted); }

    .gal-masonry { columns: 4 240px; column-gap: 12px; }
    @media (max-width: 900px) { .gal-masonry { columns: 3 200px; } }
    @media (max-width: 620px) { .gal-masonry { columns: 2 160px; } }
    .gal-ph { break-inside: avoid; margin: 0 0 12px; position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--gal-line); background: var(--gal-panel); cursor: zoom-in; transition: transform 0.18s ease, border-color 0.18s; }
    .gal-ph:hover { transform: translateY(-3px); border-color: rgba(232, 180, 90, 0.5); }
    .gal-ph img { width: 100%; height: auto; display: block; }
    .gal-ph .cap { position: absolute; inset: auto 0 0 0; padding: 0.55rem 0.7rem; font-size: 0.78rem; line-height: 1.4; color: var(--gal-ink); background: linear-gradient(transparent, rgba(6, 5, 14, 0.88)); opacity: 0; transition: opacity 0.18s; }
    .gal-ph:hover .cap, .gal-ph:focus .cap { opacity: 1; }

    .gal-empty { border: 1px dashed var(--gal-line); border-radius: 18px; padding: 2.2rem 1.6rem; text-align: center; color: var(--gal-muted); }
    .gal-empty i { font-size: 2rem; color: var(--gal-gold); }
    .gal-empty h3 { font-family: var(--gal-serif); color: var(--gal-ink); margin: 0.6rem 0 0.3rem; font-size: 1.2rem; }
    .gal-empty p { font-size: 0.9rem; max-width: 52ch; margin: 0 auto 1rem; line-height: 1.55; }

    .gal-add { margin: 2.2rem 0 1rem; border: 1px solid var(--gal-line); border-radius: 22px; background: var(--gal-panel); padding: 1.8rem; display: grid; gap: 0.8rem; }
    .gal-add h2 { font-family: var(--gal-serif); margin: 0; font-size: 1.5rem; color: var(--gal-ink); }
    .gal-add p { margin: 0; color: var(--gal-muted); font-size: 0.92rem; line-height: 1.55; }
    .gal-add .row { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.4rem; }
    .gal-consent { font-size: 0.8rem; color: var(--gal-muted); border-left: 2px solid var(--gal-gold); padding-left: 0.8rem; }

    footer { position: relative; z-index: 10; border-top: 1px solid var(--gal-line); margin-top: 3rem; padding: 2.2rem 0 2.6rem; color: var(--gal-muted); font-size: 0.84rem; line-height: 1.7; }
    footer a { color: var(--gal-gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .pir-foot { display: grid; grid-template-columns: 1.2fr 2fr; gap: 2rem; align-items: start; max-width: 1180px; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2.5rem); font-family: var(--gal-sans); }
    .tended { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 0.8rem; color: rgba(243, 238, 228, 0.66); text-decoration: none; font-size: 0.8rem; }
    .tended b { color: var(--gal-gold); font-family: var(--gal-serif); }
    .cat-mark { width: 0.85rem; height: 0.85rem; border-radius: 50%; background: conic-gradient(from 180deg, #e8b45a, #a78bfa, #e8b45a); }
    @media (max-width: 860px) { .pir-foot { grid-template-columns: 1fr; } }

    /* Lightbox */
    .gal-lb { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(4, 3, 10, 0.92); backdrop-filter: blur(8px); }
    .gal-lb.open { display: grid; grid-template-rows: auto 1fr auto; }
    .gal-lb .lb-top { display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.2rem; }
    .gal-lb .count { font-family: var(--gal-serif); color: var(--gal-muted); font-size: 0.95rem; }
    .gal-lb .count b { color: var(--gal-gold); }
    .gal-lb .lb-top .spacer { flex: 1; }
    .gal-lb .x, .gal-lb .dl { display: inline-flex; align-items: center; gap: 0.45rem; color: var(--gal-ink); text-decoration: none; font-size: 0.88rem; font-weight: 600; border: 1px solid var(--gal-line); border-radius: 999px; padding: 0.5rem 0.9rem; background: rgba(6, 5, 14, 0.6); }
    .gal-lb .x:hover, .gal-lb .dl:hover { border-color: rgba(232, 180, 90, 0.55); }
    .gal-lb .stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 4rem; }
    .gal-lb .stage img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
    .gal-lb .arrow { position: absolute; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid var(--gal-line); background: rgba(6, 5, 14, 0.7); color: var(--gal-ink); cursor: pointer; font-size: 1.2rem; }
    .gal-lb .arrow:hover { border-color: rgba(232, 180, 90, 0.6); }
    .gal-lb .arrow.prev { left: 1rem; }
    .gal-lb .arrow.next { right: 1rem; }
    .gal-lb .lb-cap { text-align: center; padding: 1rem; color: var(--gal-muted); font-size: 0.86rem; min-height: 3.2rem; }
    .gal-lb .lb-cap b { color: var(--gal-ink); }
    @media (max-width: 640px) { .gal-lb .stage { padding: 0 0.5rem; } .gal-lb .arrow { width: 2.4rem; height: 2.4rem; } .gal-lb .arrow.prev { left: 0.4rem; } .gal-lb .arrow.next { right: 0.4rem; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    /* hub parity for the footer chrome */
    .brand { display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--gal-ink); font-family: var(--gal-serif); font-weight: 700; font-size: 1.1rem; }
    .brand img { border-radius: 9px; }
    .brand small { font-family: var(--gal-sans); font-weight: 600; font-size: 0.72rem; color: var(--gal-gold); letter-spacing: 0.08em; margin-left: 0.4rem; }

    /* Header dropdown */
    .brand-drop { position: relative; }
    .brand-drop summary { list-style: none; cursor: pointer; }
    .brand-drop summary::-webkit-details-marker { display: none; }
    .brand-drop summary .ph-caret-down { font-size: 0.8rem; color: var(--gal-gold); transition: transform 0.15s ease; }
    .brand-drop[open] summary .ph-caret-down { transform: rotate(180deg); }
    .brand-menu { position: absolute; top: calc(100% + 0.6rem); left: 0; z-index: 60; min-width: 300px; display: grid; gap: 0.15rem; padding: 0.6rem; border: 1px solid var(--gal-line); border-radius: 14px; background: rgba(11, 9, 24, 0.97); backdrop-filter: blur(12px); box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
    .brand-menu a { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.7rem; border-radius: 9px; color: var(--gal-ink); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .brand-menu a:hover { background: rgba(255, 255, 255, 0.06); color: var(--gal-gold); }
    .brand-menu a i { color: var(--gal-gold); font-size: 1rem; }

    /* Scroll progress line */
    .gal-progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 100; background: linear-gradient(90deg, #e8b45a, #a78bfa); }
    .gal-band-head .gal-count { font-size: 0.8rem; font-weight: 700; color: var(--gal-violet); background: rgba(167, 139, 250, 0.1); border: 1px solid rgba(167, 139, 250, 0.3); border-radius: 999px; padding: 0.2rem 0.7rem; }

    /* The dropdown invites the first click */
    .brand-drop .brand { padding: 0.25rem 0.45rem; border-radius: 12px; animation: brand-pulse 2.6s ease-in-out infinite; }
    .brand-drop[open] .brand, .brand-drop.seen .brand { animation: none; }
    .brand-drop .tap-hint { margin-left: 0.15rem; font: 700 0.62rem/1 var(--gal-sans); letter-spacing: 0.08em; text-transform: uppercase; color: #17120a; background: linear-gradient(120deg, var(--gal-gold), var(--gal-violet)); border-radius: 999px; padding: 0.3rem 0.55rem; animation: hint-float 2.6s ease-in-out infinite; white-space: nowrap; }
    .brand-drop[open] .tap-hint, .brand-drop.seen .tap-hint { opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    @keyframes brand-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 180, 90, 0); } 50% { box-shadow: 0 0 0 6px rgba(232, 180, 90, 0.16), 0 0 16px 2px rgba(232, 180, 90, 0.22); } }
    @keyframes hint-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

    /* Album chips: a real button, not a hyperlink */
    .gal-spot .s-links a { padding: 0.45rem 0.85rem; font-size: 0.8rem; font-weight: 700; transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease; }
    .gal-spot .s-links a.s-primary { background: linear-gradient(120deg, var(--gal-violet), var(--gal-gold)); color: #17120a; border-color: transparent; }
    .gal-spot .s-links a.s-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .gal-spot .s-links a.s-ghost { background: transparent; }
    .gal-spot .s-links a.s-ghost:hover { border-color: rgba(232, 180, 90, 0.55); color: var(--gal-gold); transform: translateY(-1px); }

    /* The Convention site stands out from the crowd */
    .gal-btn.convention-cta { background: linear-gradient(120deg, var(--gal-gold), var(--gal-violet)); color: #17120a; border-color: transparent; animation: conv-glow 2.8s ease-in-out infinite; }
    .gal-btn.convention-cta .ph-arrow-right { transition: transform 0.18s ease; }
    .gal-btn.convention-cta:hover .ph-arrow-right { transform: translateX(4px); }
    @keyframes conv-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 180, 90, 0); } 50% { box-shadow: 0 0 22px 0 rgba(232, 180, 90, 0.35); } }
  </style>
</head>
